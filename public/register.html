
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NovaStore</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-box">
            <h1>NovaStore</h1>
            <p class="subtitle">Create your account and start shopping.</p>

            <form id="registerForm">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" minlength="6" required>

                <button type="submit">Create Account</button>
            </form>

            <p id="message"></p>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="landing.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
